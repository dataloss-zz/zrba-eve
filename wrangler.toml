name = "zrba-eve"
main = "src/index.js"
compatibility_date = "2026-10-22"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/exchange", "/callback", "/applications"]

# KV binding APPLICATIONS is set in the Cloudflare dashboard
# (Workers & Pages → zrba-eve → Settings → Bindings)
